[package]
name = "lxmfchat"
version = "0.1.0"
authors = ["precursor-reticulum"]
edition = "2021"
description = "Reticulum LXMF messaging client for Precursor"

# Dependency versions are pinned by the workspace Cargo.lock.
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.70"
xous-ipc = "0.10.10"
log-server = { package = "xous-api-log", version = "0.1.69" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.70" }
xous-names = { package = "xous-api-names", version = "0.9.71" }
susres = { path = "../../api/xous-api-susres", package = "xous-api-susres" }
gam = { path = "../../services/gam" }
llio = { path = "../../services/llio" }
ux-api = { path = "../../libs/ux-api" }
blitstr2 = { path = "../../libs/blitstr2" }
trng = { path = "../../services/trng" }
net = { path = "../../services/net" }
com = { path = "../../services/com" }
com_rs = { git = "https://github.com/betrusted-io/com_rs", rev = "891bdd3ca8e41f81510d112483e178aea3e3a921" }
pddb = { path = "../../services/pddb" }
modals = { path = "../../services/modals" }
chat = { path = "../../libs/chat" }

# portable protocol crates
reticulum-core = { path = "../../libs/reticulum-core" }
lxmf = { path = "../../libs/lxmf" }
micron = { path = "../../libs/micron" }

[features]
default = []
